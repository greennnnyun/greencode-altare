{% extends 'base.html' %}
{% block title %}重置密码 · 蛋壳栖所{% endblock %}
{% block content %}
<div class="container-page max-w-md pt-24 pb-10">
  <h1 class="text-[26px] text-center">找回密码</h1>
  <p class="mt-1 text-center text-sm text-text-muted">输入注册邮箱，我们会发送 6 位数字验证码，不使用链接重置。</p>
  <form method="post" class="card-soft mt-6 space-y-4 p-6">
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="alert alert-error text-sm">{{ form.non_field_errors }}</div>{% endif %}
    <label class="block">
      <span class="mb-1 block text-xs text-text-muted">注册邮箱</span>
      {{ form.email }}
      {% if form.email.errors %}<p class="mt-1 text-xs text-error">{{ form.email.errors|join:'；' }}</p>{% endif %}
    </label>
    <button type="submit" class="btn btn-primary w-full rounded-full hover-lift">发送重置验证码</button>
  </form>
  <p class="mt-4 text-center text-sm text-text-muted"><a href="{% url 'accounts:login' %}" class="text-primary-strong hover:underline">返回登录</a></p>
</div>
{% endblock %}
