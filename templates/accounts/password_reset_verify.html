{% extends 'base.html' %}
{% block title %}设置新密码 · 蛋壳栖所{% endblock %}
{% block content %}
<div class="container-page max-w-md pt-24 pb-10">
  <h1 class="text-[26px] text-center">设置新密码</h1>
  <p class="mt-1 text-center text-sm text-text-muted">验证码已发送至 <span class="font-medium text-text">{{ email }}</span>，10 分钟内有效。</p>
  <form method="post" class="card-soft mt-6 space-y-4 p-6">
    {% csrf_token %}
    <input type="hidden" name="email" value="{{ email }}">
    {% if form.non_field_errors %}<div class="alert alert-error text-sm">{{ form.non_field_errors }}</div>{% endif %}
    <label class="block">
      <span class="mb-1 block text-xs text-text-muted">验证码</span>
      {{ form.code }}
      {% if form.code.errors %}<p class="mt-1 text-xs text-error">{{ form.code.errors|join:'；' }}</p>{% endif %}
    </label>
    <label class="block">
      <span class="mb-1 block text-xs text-text-muted">新密码</span>
      {{ form.password1 }}
      {% if form.password1.errors %}<p class="mt-1 text-xs text-error">{{ form.password1.errors|join:'；' }}</p>{% endif %}
    </label>
    <label class="block">
      <span class="mb-1 block text-xs text-text-muted">确认新密码</span>
      {{ form.password2 }}
      {% if form.password2.errors %}<p class="mt-1 text-xs text-error">{{ form.password2.errors|join:'；' }}</p>{% endif %}
    </label>
    <button type="submit" class="btn btn-primary w-full rounded-full hover-lift">重置密码</button>
  </form>
</div>
{% endblock %}
