{% extends 'base.html' %}
{% block title %}邮箱验证 · 蛋壳栖所{% endblock %}
{% block content %}
<div class="container-page max-w-md pt-24 pb-10">
  <div class="text-center">
    <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-primary/20 border border-primary/40">
      <svg viewBox="0 0 24 24" class="h-7 w-7" fill="none" stroke="#c2571a" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
    </span>
    <h1 class="mt-4 text-[24px]">{{ purpose_label|default:'邮箱验证' }}</h1>
    <p class="mt-1 text-sm text-text-muted">验证码已发送至 <span class="font-medium text-text">{{ email }}</span>，10 分钟内有效。</p>
  </div>

  <form method="post" class="card-soft mt-6 space-y-4 p-6">
    {% csrf_token %}
    <input type="hidden" name="email" value="{{ email }}">
    <input type="hidden" name="purpose" value="{{ purpose }}">
    <label class="block">
      <span class="mb-1 block text-xs text-text-muted">6 位数字验证码</span>
      <input type="text" name="code" maxlength="6" inputmode="numeric" autocomplete="one-time-code" required
             class="input input-bordered w-full text-center text-xl tracking-[0.45em] field-glow" placeholder="000000">
    </label>
    <button type="submit" class="btn btn-primary w-full rounded-full hover-lift">
      {% if purpose == 'signup' %}验证并激活{% else %}验证并继续{% endif %}
    </button>
    <p class="text-center text-xs text-text-muted">没收到？请检查垃圾邮件箱，或稍后重发</p>
  </form>

  <form method="post" action="{% url 'accounts:resend_otp' %}" class="mt-3 text-center">
    {% csrf_token %}
    <input type="hidden" name="email" value="{{ email }}">
    <input type="hidden" name="purpose" value="{{ purpose }}">
    <button type="submit" class="btn btn-ghost btn-sm rounded-full border border-border">重新发送验证码</button>
    <p class="mt-2 text-[11px] text-text-muted">同一邮箱 60 秒内只发送 1 封，同一网络每小时最多 10 封</p>
  </form>
</div>
{% endblock %}
