{% extends 'base.html' %}
{% block title %}修改密码 · 蛋壳栖所{% endblock %}
{% block content %}
<div class="container-page max-w-md pt-24 pb-10">
  <h1 class="text-[26px] text-center">修改密码</h1>
  <p class="mt-1 text-center text-sm text-text-muted">新密码需至少 8 位，并同时包含字母和数字。</p>
  <form method="post" class="card-soft mt-6 space-y-4 p-6">
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="alert alert-error text-sm">{{ form.non_field_errors }}</div>{% endif %}
    <label class="block">
      <span class="mb-1 block text-xs text-text-muted">当前密码</span>
      {{ form.old_password }}
      {% if form.old_password.errors %}<p class="mt-1 text-xs text-error">{{ form.old_password.errors|join:'；' }}</p>{% endif %}
    </label>
    <label class="block">
      <span class="mb-1 block text-xs text-text-muted">新密码</span>
      {{ form.new_password1 }}
      {% if form.new_password1.errors %}<p class="mt-1 text-xs text-error">{{ form.new_password1.errors|join:'；' }}</p>{% endif %}
    </label>
    <label class="block">
      <span class="mb-1 block text-xs text-text-muted">确认新密码</span>
      {{ form.new_password2 }}
      {% if form.new_password2.errors %}<p class="mt-1 text-xs text-error">{{ form.new_password2.errors|join:'；' }}</p>{% endif %}
    </label>
    <button type="submit" class="btn btn-primary w-full rounded-full hover-lift">保存新密码</button>
    <p class="text-center text-xs text-text-muted"><a href="{% url 'accounts:profile' %}" class="hover:text-primary-strong">返回个人中心</a></p>
  </form>
</div>
{% endblock %}
